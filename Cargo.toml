[workspace]
resolver = "2"
members = [
  "crates/radiocraft-core",
  "crates/radiocraft-db",
  "crates/radiocraft-audio",
  "crates/radiocraft-settings",
  "crates/radiocraft-net",
  "crates/radiocraft-plugin",
  "crates/radiocraft-server",
  "crates/radiocraft-window",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["RadioCraft contributors"]

[workspace.dependencies]
radiocraft-core = { path = "crates/radiocraft-core" }
radiocraft-db = { path = "crates/radiocraft-db" }
radiocraft-audio = { path = "crates/radiocraft-audio" }
radiocraft-settings = { path = "crates/radiocraft-settings" }
radiocraft-net = { path = "crates/radiocraft-net" }
radiocraft-plugin = { path = "crates/radiocraft-plugin" }
radiocraft-server = { path = "crates/radiocraft-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rust_decimal = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
lto = "thin"
