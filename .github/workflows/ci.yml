name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  appimage:
    name: AppImage (manylinux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t manyrust -f .github/Dockerfile.manyrust .github
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Build AppImage
        run: CONTAINER=docker IMAGE=manyrust bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: radiocraft-appimage
          path: dist/*.AppImage
