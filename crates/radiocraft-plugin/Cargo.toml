[package]
name = "radiocraft-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
# Exposes a simple test Host implementation for downstream plugin tests.
test-util = []

[dependencies]
radiocraft-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libloading = "0.8"

[dev-dependencies]
# Integration tests use the crate's own `test-util` feature.
radiocraft-plugin = { path = ".", features = ["test-util"] }
