[package]
name = "radiocraft-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Real system tray icon. Off by default because `tray-icon` pulls in the GTK
# 3 stack on Linux, which not every build host has installed. Without the
# feature the close-to-tray policy still works (the window is hidden); there
# is just no tray button to show it again.
tray = ["dep:tray-icon"]

[dependencies]
radiocraft-core.workspace = true
radiocraft-db.workspace = true
radiocraft-audio.workspace = true
radiocraft-settings.workspace = true
radiocraft-net.workspace = true
radiocraft-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
rfd = "0.15"
rust_decimal = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "sync", "macros"] }
tray-icon = { version = "0.19", optional = true }

[dev-dependencies]
tempfile = "3"
